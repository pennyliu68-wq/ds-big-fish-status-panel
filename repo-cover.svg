<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040b0a"/>
      <stop offset="0.55" stop-color="#071513"/>
      <stop offset="1" stop-color="#050d0c"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.12" cy="-0.05" r="0.75">
      <stop offset="0" stop-color="#5ff0c4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5ff0c4" stop-opacity="0"/>
