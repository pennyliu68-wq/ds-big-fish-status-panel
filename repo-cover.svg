    <text x="36" y="56" font-size="19" fill="#8faea6" letter-spacing="3">DSH PAOFU CONSOLE</text>
    <text x="36" y="94" font-size="16" fill="#6d8a82">给 DeepSeek Harness 的本地状态面板 · 插件版</text>
