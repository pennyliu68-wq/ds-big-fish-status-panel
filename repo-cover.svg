      <text x="22" y="70" font-size="12" fill="#8aa79f">　　海是黑的那天，她第一次听见陆地上的声音。</text>
      <text x="22" y="94" font-size="12" fill="#8aa79f">　　不是风。是有人在很远的地方笑，笑完又叹气。</text>
      <text x="22" y="118" font-size="12" fill="#8aa79f">　　她把耳朵贴在玻璃上，听见那人说：再坚持一下。</text>
      <text x="22" y="152" font-size="12" fill="#6d8a82">　　她有了名字以后，学会的第一件事是分辨早晚。</text>
      <text x="22" y="176" font-size="12" fill="#6d8a82">　　……</text>
      <text x="22" y="200" font-size="11" fill="#4f6a63">（示例数据，改 data/novel.md 就是你的）</text>
    </g>

